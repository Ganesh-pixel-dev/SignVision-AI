<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SignVision letters</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="top">
    <h1>SignVision <span>letters</span></h1>
    <p id="status" class="pill" role="status">Checking</p>
</header>
<p id="alert" class="alert" role="alert" hidden></p>

<main class="wrap">
    <section class="cam" aria-label="Camera">
        <img src="{{ url_for('video_feed') }}" alt="Live camera with hand outline">
    </section>

    <section class="out" aria-labelledby="wt">
        <h2 id="wt">Word so far</h2>
        <p class="word" id="word" aria-live="polite" aria-atomic="true">Nothing yet</p>
        <p class="reading">Letter <strong id="letter">none</strong>
            Confidence <meter id="conf" min="0" max="100" value="0" aria-label="Confidence"></meter> <strong id="confText">0%</strong></p>
        <div class="row">
            <button id="speakBtn" class="btn primary" type="button">Speak and clear</button>
            <button id="backBtn" class="btn" type="button">Delete last letter</button>
            <button id="resetBtn" class="btn" type="button">Clear</button>
        </div>
        <h2>Spoken words</h2>
        <ol id="history"></ol>
        <p class="hint">Letters A to J only. A letter is added after about a second of holding it still.</p>
    </section>
</main>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
